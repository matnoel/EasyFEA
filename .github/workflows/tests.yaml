name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    
    name: Test 
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa

      - name: Set up a headless display, so PyVista movies render
        uses: pyvista/setup-headless-display-action@v5
      
      - name: Install dependencies
        run: |
          uv pip install --system "meshio @ git+https://github.com/matnoel/meshio.git@medit_higher_order_elements"
          uv pip install --system .[dev,io,viz]
      
      - name: Run tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13') }}
        run: uv run pytest

      - name: Run tests with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' }}
        run: uv run pytest --cov --cov-report=term-missing:skip-covered

  run-tests-mpi:
    name: Test MPI
    runs-on: ubuntu-latest
    env:
      PETSC_CONFIGURE_OPTIONS: --with-debugging=0 --download-mumps --download-scalapack --download-parmetis --download-metis --download-superlu_dist

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libopenmpi-dev openmpi-bin gfortran

      - name: Install dependencies
        run: |
          uv pip install --system "meshio @ git+https://github.com/matnoel/meshio.git@medit_higher_order_elements"
          uv pip install --system .[dev,io,viz] mpi4py

      - name: Cache the petsc and petsc4py wheels, built from source
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: petsc-${{ runner.os }}-py3.13-${{ env.PETSC_CONFIGURE_OPTIONS }}

      - name: Install petsc and petsc4py
        run: |
          python -m pip install "cython<3.3" setuptools numpy
          python -m pip install petsc
          python -m pip install --no-build-isolation petsc4py
          python -c "from petsc4py import PETSc; print(PETSc.Sys.getVersion())"

      - name: Run MPI tests
        run: make test-mpi
