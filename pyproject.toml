[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "easyfea"
version = "4.0.0"
description = "User-friendly Python library that simplifies finite element analysis."
authors = [{ name = "Matthieu Noel", email = "noel.mat@proton.me" }]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["finite-element-analysis", "phase-field", "python", "easy", "fem"]
license = { file = "LICENSE.txt" }
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "gmsh>=4.12",
    "scipy",
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "jax"]
# pinned so CI and every machine format alike
lint = [
    "black==26.5.1",
    "ruff==0.16.5",
    "mdformat==1.0.0",
    "mdformat-myst==0.3.0",
]
io = ["imageio", "imageio[ffmpeg]", "meshio"]
jax = ["jax"]
viz = ["matplotlib", "pyvista", "pygltflib", "usd-core"]

[project.urls]
Documentation = "https://easyfea.readthedocs.io/en/latest/"
Repository = "https://github.com/matnoel/EasyFEA"
Issues = "https://github.com/matnoel/EasyFEA/issues"
Changelog = "https://github.com/matnoel/EasyFEA/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["EasyFEA", "EasyFEA.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
disable_error_code = [
    "safe-super",
    "import-untyped",
    "override",
    "union-attr",
    "import-not-found",
    "assignment",
]

[tool.ruff]
# no target-version: inferred from requires-python, so ruff never proposes syntax 3.10 cannot run
include = ["pyproject.toml", "EasyFEA/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
# pinned, so a ruff release cannot silently enable hundreds of new rules
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741", "F402"]

[tool.ruff.lint.per-file-ignores]
# imports must follow module-level setup (BUILDING_GALLERY, requires_* decorators)
"__init__.py" = ["F401", "E402"]
"USD.py" = ["E402"]
"Geoms.py" = ["F401"]
"Models.py" = ["F401"]
"Simulations.py" = ["F401"]
